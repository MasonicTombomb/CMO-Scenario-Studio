name: release

# The only workflow: push a tag like v1.2.0 to build the Windows installer and portable zip and publish a GitHub
# release with them attached. Ordinary pushes run nothing. The test step takes seconds and stops a broken build
# being published.
#
# Code signing is optional: add the repository secrets SIGN_PFX_BASE64 (the .pfx certificate, base64-encoded) and
# SIGN_PFX_PASSWORD and the exe, setup and uninstaller are signed. Without them the build is unsigned.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
      SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .[dev] pyinstaller
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - name: Test
        timeout-minutes: 5
        run: pytest -q
      - name: Signing certificate
        if: env.SIGN_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          "CMO_SIGN_PFX=$pfx" >> $env:GITHUB_ENV
          "CMO_SIGN_PFX_PASSWORD=$env:SIGN_PFX_PASSWORD" >> $env:GITHUB_ENV
      - name: Build exe, installer and zip
        run: python packaging/build_release.py
      - name: Remove certificate
        if: always() && env.SIGN_PFX_BASE64 != ''
        shell: pwsh
        run: Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $env:RUNNER_TEMP "codesign.pfx")
      - name: Version
        id: version
        shell: bash
        run: echo "version=$(python -c "import sys; sys.path.insert(0,'src'); import cmo_studio; print(cmo_studio.__version__)")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: CMO-Scenario-Studio-${{ steps.version.outputs.version }}-win64
          path: release/*
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: CMO Scenario Studio ${{ steps.version.outputs.version }}
          body_path: docs/releases/${{ steps.version.outputs.version }}.md
          files: |
            release/*-setup.exe
            release/*.zip
            release/*.sha256
