
name: Bug Report
description: Report a bug or unexpected behaviour.
title: "[BUG] "
labels:
  - bug
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## Bug Report

        Thank you for taking the time to report a problem.
        Please provide as much information as possible to help us
        reproduce and investigate the issue.

  - type: textarea
    id: summary
    attributes:
      label: Issue Summary
      description: A clear and concise description of the problem.
      placeholder: Describe what happened...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: List the steps required to reproduce the issue.
      placeholder: |
        1. Open...
        2. Add...
        3. Assign...
        4. Build...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: Error Messages / Build Output
      description: Paste any relevant errors, logs or console output.
      render: text

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant software and version information.
      value: |
        Application:
        Application Version:
        Build Number:
        Editor Version:
        Lua Version:
        Operating System:
    validations:
      required: true

  - type: textarea
    id: affected
    attributes:
      label: Affected Units / Components
      description: List any affected units, components, IDs or other relevant information.
      placeholder: |
        Unit:
        Database ID:
        Loadout ID:
        Side:
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Anything else that might help investigate the problem.
    validations:
      required: false

  - type: textarea
    id: attachments
    attributes:
      label: Attachments / Supporting Files
      description: |
        Drag and drop screenshots, scenario files, logs or other
        supporting material into this field.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Submission Checklist
      options:
        - label: I have checked that this issue has not already been reported.
          required: true
        - label: I have provided the relevant version information.
          required: true
        - label: I have included error messages or logs where applicable.
          required: false
